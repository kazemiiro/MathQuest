<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Quest</title>

<style>

body{
    margin:0;
    background:#222;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

#title{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#1d3557;
}

h1{
    font-size:60px;
}

button{
    width:250px;
    height:60px;
    font-size:25px;
    margin:10px;
}

canvas{
    display:none;
    background:#4caf50;
}

#info{
    position:absolute;
    top:10px;
    left:10px;
    font-size:20px;
    display:none;
}

</style>

</head>

<body>


<div id="title">

<h1>⚔ Math Quest</h1>

<button onclick="startGame()">
はじめから
</button>

</div>

<div id="info">

HP:
<span id="hp">100</span>
/
<span id="maxhp">100</span>

　

Lv:
<span id="lv">1</span>

　

EXP:
<span id="exp">0</span>
　

💰:
<span id="gold">0</span>
    
</div>



<canvas id="game" width="960" height="640"></canvas>



<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


// プレイヤー

    let player={

x:100,
y:100,
size:32,
speed:4,

hp:100,
maxHp:100,

level:1,
exp:0,

attack:10,
gold:0,

weapon:"木の棒"
        
};


// キー

let keys={};


document.addEventListener("keydown",e=>{
keys[e.key]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});




// 木

const trees=[

{x:150,y:100},
{x:300,y:200},
{x:600,y:120},
{x:800,y:300},
{x:200,y:500}

];


// 家

const houses=[

{x:400,y:300}

];


// NPC

let npc={

x:150,
y:120,
size:32

};

let shop={

x:250,
y:120,
size:32

};

// 敵

let enemy = null;
let battle = false;



function startGame(){

document.getElementById("title").style.display="none";

canvas.style.display="block";

document.getElementById("info").style.display="block";


loop();

}




function loop(){

update();

draw();

requestAnimationFrame(loop);

}




function update(){


if(keys["ArrowUp"])
player.y-=player.speed;


if(keys["ArrowDown"])
player.y+=player.speed;


if(keys["ArrowLeft"])
player.x-=player.speed;


if(keys["ArrowRight"])
player.x+=player.speed;


// NPCに近づくと戦闘

let distance=Math.sqrt(

(player.x-npc.x)**2+
(player.y-npc.y)**2

);


if(distance<60 && !battle){

startBattle();

}

let shopDistance=Math.sqrt(

(player.x-shop.x)**2+
(player.y-shop.y)**2

);


if(shopDistance<60){

buyWeapon();

}

}




function draw(){


ctx.fillStyle="#6ab04c";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);



// 木

trees.forEach(t=>{


ctx.fillStyle="#8B4513";

ctx.fillRect(
t.x+10,
t.y+20,
12,
25
);


ctx.fillStyle="green";

ctx.beginPath();

ctx.arc(
t.x+16,
t.y+16,
20,
0,
Math.PI*2
);

ctx.fill();


});



// 家

houses.forEach(h=>{


ctx.fillStyle="#deb887";

ctx.fillRect(
h.x,
h.y,
70,
60
);


ctx.fillStyle="red";

ctx.beginPath();

ctx.moveTo(
h.x-5,
h.y
);

ctx.lineTo(
h.x+35,
h.y-35
);

ctx.lineTo(
h.x+75,
h.y
);

ctx.fill();


});




// NPC

ctx.fillStyle="orange";

ctx.fillRect(
npc.x,
npc.y,
npc.size,
npc.size
);

    // 武器屋

ctx.fillStyle="purple";

ctx.fillRect(
shop.x,
shop.y,
shop.size,
shop.size
);


// 主人公

ctx.fillStyle="blue";

ctx.fillRect(
player.x,
player.y,
player.size,
player.size
);



}

// =====================
// 数学バトルシステム
// =====================




function startBattle(){

battle=true;


let enemies=[

{
name:"スライム",
hp:30,
exp:10,
gold:5
},

{
name:"ゴブリン",
hp:50,
exp:20,
gold:10
},

{
name:"オオカミ",
hp:70,
exp:30,
gold:15
},

{
name:"ドラゴン",
hp:120,
exp:100,
gold:50
}

];


enemy=enemies[
Math.floor(Math.random()*enemies.length)
];


alert(
"⚔ "+enemy.name+"が現れた！\n\n"+
"HP："+enemy.hp
);


makeQuestion();

}



let answer=0;


function makeQuestion(){

let a=Math.floor(Math.random()*10)+1;
let b=Math.floor(Math.random()*10)+1;


answer=a+b;


let user=prompt(
"🧮 数学問題！\n\n"+
a+" + "+b+" = ?"
);


if(user==null){
return;
}


if(Number(user)===answer){

enemy.hp-=player.attack;

alert(
"正解！\n"+
enemy.name+"に"+player.attack+"ダメージ！\n"+
"敵HP："+enemy.hp
);

}else{


player.hp-=10;


document.getElementById("hp").textContent=
player.hp;


alert(
"不正解！\n"+
"あなたは10ダメージ！"
);


}



// 勝利



if(enemy.hp<=0){

alert(
"🎉 "+enemy.name+"を倒した！\n"+
"経験値"+enemy.exp+"獲得！\n"+
"ゴールド"+enemy.gold+"枚獲得！"
);


player.exp+=enemy.exp;

player.gold+=enemy.gold;
document.getElementById("gold").textContent=
player.gold;

levelCheck();

function buyWeapon(){


if(player.gold>=20){


player.gold-=20;


player.attack+=10;


player.weapon="鉄の剣";


document.getElementById("gold").textContent=
player.gold;


alert(
"⚔ 鉄の剣を買った！\n"+
"攻撃力+10！"
);


}else{


alert(
"💰 お金が足りない！\n"+
"鉄の剣は20Gです"
);


}


}


document.getElementById("exp").textContent=
player.exp;

}else{


setTimeout(makeQuestion,500);

}

battle=false;


}

function levelCheck(){


if(player.exp >= player.level * 20){


player.level++;


player.exp=0;


player.maxHp+=20;

player.hp=player.maxHp;


player.attack+=5;



document.getElementById("lv").textContent=
player.level;


document.getElementById("hp").textContent=
player.hp;


document.getElementById("maxhp").textContent=
player.maxHp;



alert(
"🎊 レベルアップ！\n\n"+
"Lv "+player.level+"\n"+
"HPと攻撃力が上がった！"
);


}


}

</script>


</body>
</html>
