<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Quest</title>

<style>

body{
    margin:0;
    background:#222;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

#title{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#1d3557;
}

h1{
    font-size:60px;
}

button{
    width:250px;
    height:60px;
    font-size:25px;
    margin:10px;
}

canvas{
    display:none;
    background:#4caf50;
}

#info{
    position:absolute;
    top:10px;
    left:10px;
    font-size:20px;
    display:none;
}

</style>

</head>

<body>


<div id="title">

<h1>⚔ Math Quest</h1>

<button onclick="startGame()">
はじめから
</button>

</div>

<div id="info">

HP:
<span id="hp">100</span>
/
<span id="maxhp">100</span>

　

Lv:
<span id="lv">1</span>

　

EXP:
<span id="exp">0</span>
　

💰:
<span id="gold">0</span>

<br>

⚔ 武器:
<span id="weapon">
木の棒
</span>

<br>

🛡 防具:
<span id="armor">
なし
</span>
    
</div>



<canvas id="game" width="960" height="640"></canvas>



<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


// プレイヤー

    let player={

x:100,
y:100,
size:32,
speed:4,

hp:100,
maxHp:100,

level:1,
exp:0,

attack:10,
defense:0,
gold:0,

weapon:"木の棒",

hasSword:false,
hasArmor:false,
potion:0
        
};


// キー

let keys={};

let nearShop=false;
let nearNpc=false;
let nearCave=false;

let questCount=0;

let questStart=false;


document.addEventListener("keydown",e=>{

if(e.key==="e" && nearCave){

inCave=!inCave;

alert(
inCave?
"🕳 洞窟へ入った！敵が強くなった！":
"🌳 外へ出た！"
);

}


if(e.key==="e" && nearNpc){

if(!questStart){

questStart=true;

alert(
"🧑 村人\n\n"+
"スライムを3体倒してくれ！"
);

}else if(questCount>=3 && !npc.complete){

npc.complete=true;

player.gold+=100;
player.exp+=50;

document.getElementById("gold").textContent=
player.gold;

document.getElementById("exp").textContent=
player.exp;


alert(
"🎉 クエスト達成！\n\n"+
"💰100G\n"+
"EXP50"
);

}

}

keys[e.key]=true;


if(e.key==="e" && nearShop){

alert(
"🏪 武器屋\n\n"+
"1キー：鉄の剣（20G）\n"+
"2キー：鉄の鎧（30G）"
);

}

if(nearShop){

if(e.key==="1"){
buyWeapon();
}

if(e.key==="2"){
buyArmor();
}

}


if(e.key==="h"){

usePotion();

}

});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});




// 木

const trees=[

{x:150,y:100},
{x:300,y:200},
{x:600,y:120},
{x:800,y:300},
{x:200,y:500}

];


// 家

const houses=[

{x:400,y:300}

];


// NPC

let npc={

x:150,
y:120,
size:32,
quest:false,
complete:false

};


let shop={

x:250,
y:120,
size:32

};

// 魔王城

let bossCastle={

x:850,
y:520,
size:50

};

let bossDefeated=false;

// 洞窟

let cave={

x:600,
y:500,
size:50

};

let inCave=false;

// 敵

let enemy = null;
let currentFieldEnemy=null;
let battle = false;
let battleCooldown = false;
let shopCooldown = false;

// フィールド敵
let fieldEnemies=[

{
x:500,
y:200,
size:32,
alive:true,
type:"スライム"
},

{
x:700,
y:400,
size:32,
alive:true,
type:"ゴブリン"
},

{
x:300,
y:500,
size:32,
alive:true,
type:"オオカミ"
}

];


let enemyRespawnTime = 5000;



function startGame(){

document.getElementById("title").style.display="none";

canvas.style.display="block";

document.getElementById("info").style.display="block";


loop();

}




function loop(){

update();

let shopDistance=Math.sqrt(

(player.x-shop.x)**2+
(player.y-shop.y)**2

);


nearShop = shopDistance < 60;
let npcDistance=Math.sqrt(

(player.x-npc.x)**2+
(player.y-npc.y)**2

);


nearNpc = npcDistance < 60;

let caveDistance=Math.sqrt(

(player.x-cave.x)**2+
(player.y-cave.y)**2

);


nearCave = caveDistance < 60;

draw();

requestAnimationFrame(loop);

if(player.x<0)
player.x=0;

if(player.y<0)
player.y=0;

if(player.x>canvas.width-player.size)
player.x=canvas.width-player.size;

if(player.y>canvas.height-player.size)
player.y=canvas.height-player.size;

}




function update(){


if(!battle){

if(keys["ArrowUp"])
player.y-=player.speed;


if(keys["ArrowDown"])
player.y+=player.speed;


if(keys["ArrowLeft"])
player.x-=player.speed;


if(keys["ArrowRight"])
player.x+=player.speed;

}


// 敵に近づくと戦闘

fieldEnemies.forEach(e=>{

// 魔王城に入る

let bossDistance=Math.sqrt(

(player.x-bossCastle.x)**2+
(player.y-bossCastle.y)**2

);


if(
bossDistance<60 &&
!bossDefeated &&
!battle
){

startBossBattle();

}




    
let enemyDistance=Math.sqrt(

(player.x-e.x)**2+
(player.y-e.y)**2

);


if(enemyDistance<60 && e.alive && !battle && !battleCooldown){

startBattle(e);

}


});



}





      






function draw(){


if(inCave){

ctx.fillStyle="#333";

}else{

ctx.fillStyle="#6ab04c";

}

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);



// 木

trees.forEach(t=>{


ctx.fillStyle="#8B4513";

ctx.fillRect(
t.x+10,
t.y+20,
12,
25
);


ctx.fillStyle="green";

ctx.beginPath();

ctx.arc(
t.x+16,
t.y+16,
20,
0,
Math.PI*2
);

ctx.fill();


});



// 家

houses.forEach(h=>{


ctx.fillStyle="#deb887";

ctx.fillRect(
h.x,
h.y,
70,
60
);


ctx.fillStyle="red";

ctx.beginPath();

ctx.moveTo(
h.x-5,
h.y
);

ctx.lineTo(
h.x+35,
h.y-35
);

ctx.lineTo(
h.x+75,
h.y
);

ctx.fill();


});




// NPC

ctx.fillStyle="orange";

ctx.fillRect(
npc.x,
npc.y,
npc.size,
npc.size
);

if(nearNpc){

ctx.fillStyle="white";

ctx.font="18px sans-serif";

ctx.fillText(
"Eキーで話す",
npc.x-20,
npc.y-15
);

}

    // 武器屋

ctx.fillStyle="purple";

ctx.fillRect(
shop.x,
shop.y,
shop.size,
shop.size
);

if(nearShop){

ctx.fillStyle="white";

ctx.font="18px sans-serif";

ctx.fillText(
"Eキーで武器屋",
shop.x-20,
shop.y-15
);

}

// フィールド敵
// フィールド敵

fieldEnemies.forEach(e=>{

if(e.alive){

// スライム
if(e.type==="スライム"){

ctx.fillStyle="skyblue";

ctx.beginPath();

ctx.arc(
e.x+16,
e.y+16,
16,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="black";

ctx.fillRect(
e.x+8,
e.y+10,
4,
4
);

ctx.fillRect(
e.x+20,
e.y+10,
4,
4
);

}


// ゴブリン

else if(e.type==="ゴブリン"){

ctx.fillStyle="green";

ctx.fillRect(
e.x,
e.y,
32,
32
);

}


// オオカミ

else{

ctx.fillStyle="gray";

ctx.fillRect(
e.x,
e.y,
32,
32
);

}

}

});


// 魔王城

if(!bossDefeated){

ctx.fillStyle="black";

ctx.fillRect(
bossCastle.x,
bossCastle.y,
bossCastle.size,
bossCastle.size
);


ctx.fillStyle="white";

ctx.font="18px sans-serif";

ctx.fillText(
"👑魔王城",
bossCastle.x-10,
bossCastle.y-10
);

}

// 洞窟

ctx.fillStyle="gray";

ctx.fillRect(
cave.x,
cave.y,
cave.size,
cave.size
);


ctx.fillStyle="white";

ctx.font="18px sans-serif";

ctx.fillText(
"🕳洞窟",
cave.x-5,
cave.y-10
);


if(nearCave){

ctx.fillText(
"Eキーで入る",
cave.x-20,
cave.y+70
);

}

// 主人公

ctx.fillStyle="blue";

ctx.fillRect(
player.x,
player.y,
player.size,
player.size
);



}

// =====================
// 数学バトルシステム
// =====================






function startBattle(field){


let enemies=[

{
name:"スライム",
hp:30,
exp:10,
gold:5
},

{
name:"ゴブリン",
hp:50,
exp:20,
gold:10
},

{
name:"オオカミ",
hp:70,
exp:30,
gold:15
},

{
name:"ドラゴン",
hp:120,
exp:100,
gold:50
}

];


enemy=enemies.find(e=>e.name===field.type);



if(inCave){

enemy.hp*=2;
enemy.exp*=2;
enemy.gold*=2;

}


battle=true;



// 5%でレアドラゴン出現
if(Math.random()<0.05){

enemy={
name:"✨レアドラゴン",
hp:200,
exp:200,
gold:100
};

alert(
"✨ レアドラゴンが現れた！"
);

}


enemy.hp += player.level * 5;


showBattle();

currentFieldEnemy=field;

}

function startBossBattle(){

battle=true;

enemy={

name:"👑 魔王ドラゴン",
hp:300,
exp:500,
gold:500

};

showBattle();

}



let answer=0;
let explanation="";


function makeQuestion(){

let type;
let a,b;


if(player.level <= 3){

let type=Math.floor(Math.random()*3);

if(type===0){

let a=Math.floor(Math.random()*30)+1;
let b=Math.floor(Math.random()*30)+1;

answer=a+b;

explanation=
a+"+"+b+"="+answer;


document.getElementById("question").textContent=
"🧮 "+a+" + "+b+" = ?";


}

else if(type===1){

let a=Math.floor(Math.random()*20)+10;
let b=Math.floor(Math.random()*10)+1;

answer=a-b;

explanation=
a+"-"+b+"="+answer;


document.getElementById("question").textContent=
"🧮 "+a+" - "+b+" = ?";


}

else{


let a=Math.floor(Math.random()*9)+2;
let b=Math.floor(Math.random()*9)+2;


answer=a*b;

explanation=
a+"×"+b+"="+answer;


document.getElementById("question").textContent=
"🧮 "+a+" × "+b+" = ?";

}

}


else if(player.level <= 7){

// 一次方程式

let x=Math.floor(Math.random()*10)+1;
let a=Math.floor(Math.random()*10)+1;

answer=x;


document.getElementById("question").textContent=
"🧮 x + "+a+" = "+(x+a)+"\n x = ?";

}


else if(player.level <= 12){


// 平方根

let n=[
[2,4],
[3,9],
[4,16],
[5,25],
[6,36]
];


let r=n[Math.floor(Math.random()*n.length)];


answer=r[0];


document.getElementById("question").textContent=
"🧮 √"+r[1]+" = ?";


}


else{

// 中3ボス級

let x=Math.floor(Math.random()*10)+1;
let a=Math.floor(Math.random()*5)+1;


answer=x;


document.getElementById("question").textContent=
"👑 "+a+"x = "+(a*x)+"\n x = ?";



}


}



function levelCheck(){

let levelUp=false;


while(player.exp >= player.level*20){

player.exp-=player.level*20;

player.level++;

player.maxHp+=20;

player.hp=player.maxHp;

player.attack+=5;

levelUp=true;

}


document.getElementById("exp").textContent=
player.exp;

document.getElementById("lv").textContent=
player.level;

document.getElementById("hp").textContent=
player.hp;

document.getElementById("maxhp").textContent=
player.maxHp;


if(levelUp){

alert(
"🎊 レベルアップ！\n\n"+
"Lv "+player.level+
"\nHPと攻撃力アップ！"
);

}

}




function usePotion(){

if(player.potion>0){

player.potion--;

player.hp+=50;


if(player.hp>player.maxHp){
player.hp=player.maxHp;
}


document.getElementById("hp").textContent=
player.hp;


alert(
"🧪 ポーションを使った！\n"+
"HPが50回復した！"
);


}else{

alert(
"🧪 ポーションを持っていない！"
);

}

}

function buyWeapon(){

if(shopCooldown){
    return;
}

shopCooldown=true;

setTimeout(()=>{
    shopCooldown=false;
},1000);


if(player.hasSword){

alert("⚔ もう鉄の剣を持っています！");
return;

}


if(player.gold>=20){

player.gold-=20;

player.attack+=10;

player.weapon="鉄の剣";

player.hasSword=true;


document.getElementById("weapon").textContent=
player.weapon;


document.getElementById("gold").textContent=
player.gold;


alert(
"⚔ 鉄の剣を買った！\n\n"+
"攻撃力 +10！"
);


}else{

alert(
"💰 お金が足りない！\n"+
"鉄の剣は20Gです"
);

}

}



function buyArmor(){

if(player.hasArmor){

alert("🛡 もう鉄の鎧を持っています！");
return;

}


if(player.gold>=30){

player.gold-=30;

player.defense+=5;



player.hasArmor=true;


document.getElementById("gold").textContent=
player.gold;


document.getElementById("armor").textContent=
"鉄の鎧";


alert(
"🛡 鉄の鎧を買った！\n\n"+
"防御力 +5！"
);


}else{

alert(
"💰 お金が足りない！\n"+
"鉄の鎧は30Gです"
);

}

}
    


function showBattle(){

    document.getElementById("battleUI").style.display="block";

    document.getElementById("enemyName").textContent=
    "⚔ "+enemy.name;

    document.getElementById("enemyHp").textContent=
    "HP："+enemy.hp;

    makeQuestion();

}


function attackEnemy(){


let input=
document.getElementById("answerInput").value;


if(Number(input)===answer){


let damage=player.attack;


// 20%でクリティカル
if(Math.random()<0.2){

damage*=2;

alert(
"✨クリティカル！\n"+
damage+"ダメージ！"
);

}else{

alert(
"正解！\n"+
damage+"ダメージ！"
);

}


enemy.hp-=damage;


}

else{


let damage=Math.max(1,10-player.defense);


if(damage<1){
damage=1;
}


player.hp-=damage;


document.getElementById("hp").textContent=
player.hp;


alert(
"❌ 不正解！\n\n"+
"正解："+answer+"\n\n"+
explanation+
"\n\n10ダメージ"
);

}

if(player.hp<=0){

alert(
"💀 ゲームオーバー！"
);

location.reload();

}


document.getElementById("answerInput").value="";


if(enemy.hp<=0){

if(enemy.name==="👑 魔王ドラゴン"){

bossDefeated=true;

player.exp+=500;
player.gold+=500;

document.getElementById("exp").textContent=
player.exp;

document.getElementById("gold").textContent=
player.gold;


alert(
"👑 魔王ドラゴン撃破！\n\n"+
"EXP +500\n"+
"💰500G"
);


document.getElementById("battleUI").style.display="none";

document.getElementById("clearUI").style.display="block";

return;

}
    


}


alert(
"🎉 "+enemy.name+"を倒した！"
);


player.exp+=enemy.exp;

player.gold+=enemy.gold;

if(enemy.name==="スライム" && questStart && !npc.complete){

questCount++;

alert(
"スライム討伐 "+questCount+"/3"
);

}


if(Math.random()<0.3){

player.potion++;

alert(
"🧪 ポーションを手に入れた！"
);

}


document.getElementById("exp").textContent=
player.exp;

document.getElementById("gold").textContent=
player.gold;

document.getElementById("exp").textContent=
player.exp;

levelCheck();



document.getElementById("gold").textContent=
player.gold;


document.getElementById("battleUI").style.display="none";

battleCooldown=true;

setTimeout(()=>{

battleCooldown=false;

},1000);

battle=false;

enemy=null;

if(currentFieldEnemy){

currentFieldEnemy.alive=false;


setTimeout(()=>{

currentFieldEnemy.x=
Math.random()*900;

currentFieldEnemy.y=
Math.random()*600;

currentFieldEnemy.alive=true;


},enemyRespawnTime);

}


}else{


document.getElementById("enemyHp").textContent=
"HP："+enemy.hp;


makeQuestion();


}


}





</script>

<div id="battleUI" style="
display:none;
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
border:3px solid white;
width:600px;
padding:20px;
text-align:center;
font-size:25px;
">

<div id="enemyName"></div>

<div id="enemyHp"></div>

<div id="question"></div>

<input id="answerInput" type="number">

<button onclick="attackEnemy()">
攻撃！
</button>

</div>

<div id="clearUI" style="
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
color:white;
font-size:50px;
text-align:center;
padding-top:200px;
">

🎉 Math Quest クリア！ 🎉

<br>

<button onclick="location.reload()">
もう一度遊ぶ
</button>

</div>


</body>
</html>
