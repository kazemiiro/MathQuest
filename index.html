<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quest</title>

<style>

body{
    margin:0;
    background:#222;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

#title{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#1d3557;
}

h1{
    font-size:64px;
    margin:0;
}

button{
    width:250px;
    height:60px;
    font-size:28px;
    margin:15px;
    cursor:pointer;
}

canvas{
    display:none;
    background:#4caf50;
}

</style>

</head>

<body>

<div id="title">

<h1>⚔ Math Quest</h1>

<button onclick="startGame()">
はじめから
</button>

</div>

<canvas id="game" width="960" height="640"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player={
x:100,
y:100,
size:32,
speed:4
};

const trees = [
    {x:120,y:80},
    {x:260,y:180},
    {x:500,y:120},
    {x:700,y:250},
    {x:820,y:480},
    {x:150,y:500}
];

const houses = [
    {x:380,y:320}
];

const npc = {
    x:420,
    y:380,
    size:32
};

let keys={};

document.addEventListener("keydown",e=>{
keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
keys[e.key]=false;
});

function startGame(){

document.getElementById("title").style.display="none";

canvas.style.display="block";

requestAnimationFrame(loop);

}

function loop(){

update();

draw();

requestAnimationFrame(loop);

}

function update(){

if(keys["ArrowUp"]) player.y-=player.speed;

if(keys["ArrowDown"]) player.y+=player.speed;

if(keys["ArrowLeft"]) player.x-=player.speed;

if(keys["ArrowRight"]) player.x+=player.speed;

}

function draw(){

    ctx.fillStyle="#6ab04c";
    ctx.fillRect(0,0,960,640);

    // 木
    trees.forEach(tree=>{

        ctx.fillStyle="#8B4513";
        ctx.fillRect(tree.x+10,tree.y+20,12,25);

        ctx.fillStyle="green";
        ctx.beginPath();
        ctx.arc(tree.x+16,tree.y+16,20,0,Math.PI*2);
        ctx.fill();

    });

    // 家
    houses.forEach(home=>{

        ctx.fillStyle="#deb887";
        ctx.fillRect(home.x,home.y,70,60);

        ctx.fillStyle="red";
        ctx.beginPath();
        ctx.moveTo(home.x-5,home.y);
        ctx.lineTo(home.x+35,home.y-35);
        ctx.lineTo(home.x+75,home.y);
        ctx.fill();

    });

    // NPC
    ctx.fillStyle="orange";
    ctx.fillRect(npc.x,npc.y,npc.size,npc.size);

    // 主人公
    ctx.fillStyle="blue";
    ctx.fillRect(player.x,player.y,player.size,player.size);

}

</script>

</body>
</html>
