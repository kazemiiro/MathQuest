function startGame(){

document.getElementById("title").style.display="none";

canvas.style.display="block";

document.getElementById("info").style.display="block";



requestAnimationFrame(loop);

}




function loop(){

update();

let shopDistance=Math.sqrt(

(player.x-shop.x)**2+
(player.y-shop.y)**2

);


nearShop = shopDistance < 60;
let npcDistance=Math.sqrt(

(player.x-npc.x)**2+
(player.y-npc.y)**2

);


nearNpc = npcDistance < 60;

let caveDistance=Math.sqrt(

(player.x-cave.x)**2+
(player.y-cave.y)**2

);


nearCave = caveDistance < 60;

draw();

requestAnimationFrame(loop);

if(player.x<0)
player.x=0;

if(player.y<0)
player.y=0;

if(player.x>world.width-player.size)
player.x=world.width-player.size;


if(player.y>world.height-player.size)
player.y=world.height-player.size;

}




function update(){


if(!battle){

// PC操作

if(keys["ArrowUp"])
player.y-=player.speed;

if(keys["ArrowDown"])
player.y+=player.speed;

if(keys["ArrowLeft"])
player.x-=player.speed;

if(keys["ArrowRight"])
player.x+=player.speed;


// スマホ操作

if(touchKeys["up"])
player.y-=player.speed;

if(touchKeys["down"])
player.y+=player.speed;

if(touchKeys["left"])
player.x-=player.speed;

if(touchKeys["right"])
player.x+=player.speed;

if(
keys["ArrowUp"]||
keys["ArrowDown"]||
keys["ArrowLeft"]||
keys["ArrowRight"]||
touchKeys["up"]||
touchKeys["down"]||
touchKeys["left"]||
touchKeys["right"]
){
    player.walk+=0.25;
}
}

// 敵の移動
fieldEnemies.forEach(e=>{

    if(!e.alive) return;

    e.x += e.dx * e.speed;
    e.y += e.dy * e.speed;

    if(e.x < 50 || e.x > world.width-50){
        e.dx *= -1;
    }

    if(e.y < 50 || e.y > world.height-50){
        e.dy *= -1;
    }

});

// 敵に近づくと戦闘

fieldEnemies.forEach(e=>{

// 魔王城に入る

let bossDistance=Math.sqrt(

(player.x-bossCastle.x)**2+
(player.y-bossCastle.y)**2

);


if(
bossDistance<60 &&
!bossDefeated &&
!battle
){

startBossBattle();

}




    
let enemyDistance=Math.sqrt(

(player.x-e.x)**2+
(player.y-e.y)**2

);


if(enemyDistance<60 && e.alive && !battle && !battleCooldown){

startBattle(e);

}


});



}

camera.y = player.y - canvas.height/2;

0,
Math.min(camera.x,world.width-canvas.width)
);

camera.y=Math.max(
0,
Math.min(camera.y,world.height-canvas.height)
);

ctx.fillStyle="#222";

ctx.fillStyle="#7ec850"; // 草原

ctx.fillStyle="#4f9d45"; // 森

0,
0,
world.width,
world.height
);

r.x,
r.y,
r.width,
r.height
);

grass.forEach(g=>{

g.x,

2
);

// フィールド敵
fieldEnemies.forEach(e=>{

ctx.fillStyle="#4ddcff";

ctx.arc(
e.x+16,
e.y+18,
18,

Math.PI*2

ctx.beginPath();

ctx.arc(
e.x+10,
e.y+14,

ctx.beginPath();

ctx.arc(

if(!bossDefeated){

function startBattle(field){


let enemies=[

{
name:"スライム",
hp:30,
exp:10,
gold:5
},

{
name:"ゴブリン",
hp:50,
exp:20,
gold:10
},

{
name:"オオカミ",
hp:70,
exp:30,
gold:15
},

{
name:"ドラゴン",
hp:120,
exp:100,
gold:50
}

];


enemy=enemies.find(e=>e.name===field.type);



if(inCave){

enemy.hp*=2;
enemy.exp*=2;
enemy.gold*=2;

}


battle=true;



// 5%でレアドラゴン出現
if(Math.random()<0.05){

enemy={
name:"✨レアドラゴン",
hp:200,
exp:200,
gold:100
};

alert(
"✨ レアドラゴンが現れた！"
);

}


enemy.hp += player.level * 5;

enemy.maxHp = enemy.hp;

showBattle();

currentFieldEnemy=field;

}

function startBossBattle(){

battle=true;

enemy={
name:"👑 魔王ドラゴン 第1形態",
hp:300,
maxHp:300,
exp:500,
gold:500
};


let bossSeconds=5;

document.getElementById("bossTimerText").textContent=
"🔥 魔王攻撃まで "+bossSeconds+"秒";


bossCountTimer=setInterval(()=>{

bossSeconds--;


document.getElementById("bossTimerText").textContent=
"🔥 魔王攻撃まで "+bossSeconds+"秒";


if(bossSeconds<=0){

let damage=20;

player.hp-=damage;

updateHP();


alert(
"🔥 魔王ドラゴンの攻撃！\n"+
damage+"ダメージ！"
);


bossSeconds=5;


}


if(player.hp<=0){

clearInterval(bossCountTimer);

alert(
"💀 魔王に敗北した..."
);

location.reload();

}


},1000);



showBattle();

}



let answer=0;
let explanation="";

let choices=[];

function makeChoices(){

let correct = answer;

choices = [
correct,
correct + 1,
correct - 1,
correct + 5
];

choices.sort(()=>Math.random()-0.5);


document.getElementById("choice0").textContent = choices[0];
document.getElementById("choice1").textContent = choices[1];
document.getElementById("choice2").textContent = choices[2];
document.getElementById("choice3").textContent = choices[3];

}



function selectAnswer(index){

let input=choices[index];


document.getElementById("answerInput").value=input;


attackEnemy();

}

function updateEnemyHP(){

let percent =
(enemy.hp / enemy.maxHp) * 100;


if(percent < 0){
percent = 0;
}


document.getElementById("enemyHpBar").style.width =
percent+"%";


document.getElementById("enemyHp").textContent =
"HP："+enemy.hp;

}

function updateHP(){

    if(player.hp<0){
        player.hp=0;
    }

    document.getElementById("hp").textContent=
        player.hp;

    document.getElementById("maxhp").textContent=
        player.maxHp;

    document.getElementById("hpBar").style.width=
        (player.hp/player.maxHp*100)+"%";

}

function makeQuestion(){

let type;


if(player.level <= 3){

// 中1 正負の数

type=Math.floor(Math.random()*3);


if(type===0){

let a=Math.floor(Math.random()*20)-10;
let b=Math.floor(Math.random()*20)-10;

answer=a+b;

explanation=
a+" + "+b+" = "+answer;

document.getElementById("question").textContent=
"🧮 "+a+" + ("+b+") = ?";


}


else if(type===1){

let a=Math.floor(Math.random()*30);
let b=Math.floor(Math.random()*20);

answer=a-b;

explanation=
a+" - "+b+" = "+answer;

document.getElementById("question").textContent=
"🧮 "+a+" - "+b+" = ?";


}


else{


let a=Math.floor(Math.random()*9)+2;
let b=Math.floor(Math.random()*9)+2;

answer=a*b;

explanation=
a+" × "+b+" = "+answer;

document.getElementById("question").textContent=
"🧮 "+a+" × "+b+" = ?";

}


}



else if(player.level <= 6){

// 中1〜中2 一次方程式


let x=Math.floor(Math.random()*20)+1;

let a=Math.floor(Math.random()*10)+1;


answer=x;


explanation=
"x="+x;


document.getElementById("question").textContent=
"🧮 x + "+a+" = "+(x+a)+"\n xを求めよ";



}



else if(player.level <=10){

// 中2 連立方程式風


let x=Math.floor(Math.random()*10)+1;

let y=Math.floor(Math.random()*10)+1;


answer=x;


explanation=
"x="+x;


document.getElementById("question").textContent=
"🧮 x + "+y+" = "+(x+y)+"\n"+
"xを求めよ";


}



else if(player.level <=15){

// 中3 平方根


let nums=[
[2,4],
[3,9],
[5,25],
[6,36],
[7,49]
];


let r=
nums[Math.floor(Math.random()*nums.length)];


answer=r[0];


explanation=
"√"+r[1]+"="+r[0];


document.getElementById("question").textContent=
"🧮 √"+r[1]+" = ?";


}


else{

// 高難度ボス問題

let a=Math.floor(Math.random()*5)+2;

let x=Math.floor(Math.random()*10)+1;


answer=x;


explanation=
"x="+x;


document.getElementById("question").textContent=
"👑 "+a+"x = "+(a*x)+"\nxを求めよ";

}


// ★全部の問題で4択を作る
makeChoices();

}


function levelCheck(){

let levelUp=false;


while(player.exp >= player.level*20){

player.exp-=player.level*20;

player.level++;

player.maxHp+=20;

player.hp=player.maxHp;

player.attack+=5;

levelUp=true;

}


document.getElementById("exp").textContent=
player.exp;

document.getElementById("lv").textContent=
player.level;

updateHP();

document.getElementById("maxhp").textContent=
player.maxHp;


if(levelUp){

alert(
"🎊 レベルアップ！\n\n"+
"Lv "+player.level+
"\nHPと攻撃力アップ！"
);

}

}




function usePotion(){

if(player.potion>0){

player.potion--;

player.hp+=50;


if(player.hp>player.maxHp){
player.hp=player.maxHp;
}


updateHP();


alert(
"🧪 ポーションを使った！\n"+
"HPが50回復した！"
);


}else{

alert(
"🧪 ポーションを持っていない！"
);

}

}

function buyWeapon(){

if(shopCooldown){
    return;
}

shopCooldown=true;




if(player.hasSword){

alert("⚔ もう鉄の剣を持っています！");
return;

}


if(player.gold>=20){

player.gold-=20;

player.attack+=10;

player.weapon="鉄の剣";

player.hasSword=true;


document.getElementById("weapon").textContent=
player.weapon;


document.getElementById("gold").textContent=
player.gold;


alert(
"⚔ 鉄の剣を買った！\n\n"+
"攻撃力 +10！"
);


}else{

alert(
"💰 お金が足りない！\n"+
"鉄の剣は20Gです"
);

}

}



function buyArmor(){

if(player.hasArmor){

alert("🛡 もう鉄の鎧を持っています！");
return;

}


if(player.gold>=30){

player.gold-=30;

player.defense+=5;



player.hasArmor=true;


document.getElementById("gold").textContent=
player.gold;


document.getElementById("armor").textContent=
"鉄の鎧";


alert(
"🛡 鉄の鎧を買った！\n\n"+
"防御力 +5！"
);


}else{

alert(
"💰 お金が足りない！\n"+
"鉄の鎧は30Gです"
);

}

}
    

function showBattle(){

    document.getElementById("battleUI").style.display="block";

    document.getElementById("enemyName").textContent=
    "⚔ "+enemy.name;

    updateEnemyHP();

    makeQuestion();


    // 回答欄へ自動移動
    setTimeout(()=>{

        document.getElementById("answerInput").focus();

    },100);

}


function attackEnemy(){

if(!battle || !enemy){
    return;
}

if(enemy.hp<=0){
    return;
}

let defeatedName = enemy.name;
    
let input=
document.getElementById("answerInput").value;


if(Number(input)===answer){


let damage=player.attack;


// 20%でクリティカル
if(Math.random()<0.2){

damage*=2;

alert(
"✨クリティカル！\n"+
damage+"ダメージ！"
);

}else{

alert(
"正解！\n"+
damage+"ダメージ！"
);

}


enemy.hp-=damage;
updateEnemyHP();

if(enemy.hp>0){

    makeQuestion();

}

}

else{


let damage=Math.max(1,10-player.defense);


if(damage<1){
damage=1;
}

player.hp-=damage;

updateHP();



alert(
"❌ 不正解！\n\n"+
"正解："+answer+"\n\n"+
explanation+
"\n\n10ダメージ"
);

}

if(player.hp<=0){

alert(
"💀 ゲームオーバー！"
);

location.reload();

}


document.getElementById("answerInput").value="";


if(enemy.hp<=0){

battle=false;

if(enemy.name==="👑 魔王ドラゴン"){

clearInterval(bossCountTimer);

document.getElementById("bossTimerText").textContent="";
    
if(!bossSecondPhase){

bossSecondPhase=true;

enemy.hp=500;
enemy.maxHp=500;

enemy.name="🔥 覚醒魔王ドラゴン";

alert(
"👑 魔王ドラゴン\n\n"+
"まだ終わらんぞ！！\n"+
"第2形態へ進化した！"
);

updateEnemyHP();

makeQuestion();

return;

}


player.exp+=500;
player.gold+=500;

document.getElementById("exp").textContent=
player.exp;

document.getElementById("gold").textContent=
player.gold;


alert(
"👑 魔王ドラゴン撃破！\n\n"+
"EXP +500\n"+
"💰500G"
);


document.getElementById("battleUI").style.display="none";

document.getElementById("clearUI").style.display="block";

return;

}
    

}


if(enemy.hp<=0){

alert(
"🎉 "+defeatedName+"を倒した！"
);


player.exp+=enemy.exp;
player.gold+=enemy.gold;

}else{

return;

}


if(enemy.name==="スライム" && questStart && !npc.complete){

questCount++;

alert(
"スライム討伐 "+questCount+"/3"
);

}


if(Math.random()<0.3){

player.potion++;

alert(
"🧪 ポーションを手に入れた！"
);

}


document.getElementById("exp").textContent=
player.exp;

document.getElementById("gold").textContent=
player.gold;

document.getElementById("exp").textContent=
player.exp;

levelCheck();



document.getElementById("gold").textContent=
player.gold;


document.getElementById("battleUI").style.display="none";

battleCooldown=true;

setTimeout(()=>{

battleCooldown=false;

},1000);

battle=false;
enemy=null;


if(currentFieldEnemy){

    let defeatedEnemy=currentFieldEnemy;

   defeatedEnemy.alive=false;

setTimeout(()=>{

    defeatedEnemy.alive=true;

},enemyRespawnTime);
   

}


currentFieldEnemy=null;

}
